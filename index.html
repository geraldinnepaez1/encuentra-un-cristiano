<body>
<title>Encuentra un Cristiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: on desktop a presenter stage (tour · phone · notes); on phones the app runs edge to edge. */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F1EEEA; --surface-3:#FFFFFF; --ink:#17140F; --ink-2:#3B352D; --muted:#6B6258; --line:#E8E3DC;
  --brand:#E2560A; --brand-ink:#FFFFFF; --brand-soft:#FFEADB; --brand-deep:#A63F03;
  --ok:#08735B; --ok-soft:#DDF5EE; --gold:#F5A70F; --wa:#128C4A; --wa-soft:#E3F4EA; --wa-ink:#FFFFFF; --danger:#D2382D; --verified-ink:#FFFFFF; --dark-card:#1C1611;
  --stage:#EFEBE6; --frame:#14110D;
  --map-land:#EAE3D8; --map-block:#F2EDE5; --map-road:#FFFFFF; --map-road-2:#D9CFC1; --map-park:#CFE3BC; --map-water:#BBD9E6; --map-water-ink:#4F7F90; --map-label:#6E6458;
  --shadow-1:0 1px 2px rgba(40,25,10,.06),0 2px 8px rgba(40,25,10,.05);
  --shadow-2:0 10px 30px -10px rgba(60,30,5,.25),0 2px 8px rgba(40,25,10,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,"Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110E0B; --surface:#1E1A15; --surface-2:#28221C; --surface-3:#3A322A; --ink:#F6F1EA; --ink-2:#D9D1C6; --muted:#B3A898; --line:#342D25;
  --brand:#FF7A2E; --brand-ink:#1A0D04; --brand-soft:#3A2214; --brand-deep:#FFA066;
  --ok:#34C9A3; --ok-soft:#163029; --gold:#FFC53D; --wa:#2BC46A; --wa-soft:#15301F; --wa-ink:#04210F; --danger:#FF6B5F; --verified-ink:#0B2A22; --dark-card:#28201A;
  --stage:#0A0806; --frame:#000000;
  --map-land:#1A1612; --map-block:#221D18; --map-road:#332C24; --map-road-2:#2A241D; --map-park:#20301B; --map-water:#173039; --map-water-ink:#6E9AAA; --map-label:#A39886;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 30px -10px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110E0B; --surface:#1E1A15; --surface-2:#28221C; --surface-3:#3A322A; --ink:#F6F1EA; --ink-2:#D9D1C6; --muted:#B3A898; --line:#342D25;
  --brand:#FF7A2E; --brand-ink:#1A0D04; --brand-soft:#3A2214; --brand-deep:#FFA066;
  --ok:#34C9A3; --ok-soft:#163029; --gold:#FFC53D; --wa:#2BC46A; --wa-soft:#15301F; --wa-ink:#04210F; --danger:#FF6B5F; --verified-ink:#0B2A22; --dark-card:#28201A;
  --stage:#0A0806; --frame:#000000;
  --map-land:#1A1612; --map-block:#221D18; --map-road:#332C24; --map-road-2:#2A241D; --map-park:#20301B; --map-water:#173039; --map-water-ink:#6E9AAA; --map-label:#A39886;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 30px -10px rgba(0,0,0,.6);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.s{width:16px;height:16px}.ic.xs{width:13px;height:13px;stroke-width:2.2}.ic.l{width:24px;height:24px}.ic.xl{width:30px;height:30px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:700}
p{margin:0}

/* ---------- Stage ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:minmax(220px,300px) auto minmax(220px,320px);gap:40px;justify-content:center;align-items:center;padding-block:28px;padding-inline:24px}
.tour,.notes{align-self:center}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brandrow b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;line-height:1.05}
.verse{margin:-8px 0 22px;padding:12px 14px;border-left:3px solid var(--brand);background:var(--surface);border-radius:0 12px 12px 0;font-size:13px;line-height:1.45;color:var(--ink-2);font-style:italic;text-wrap:pretty}
.verse cite{display:block;margin-top:6px;font-style:normal;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-deep)}
.appbrand{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.appbrand b{font-family:var(--f-display);font-size:16px;letter-spacing:-.02em;line-height:1.1}
.appbrand .vs2{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;font-style:italic;color:var(--muted);letter-spacing:0;margin-top:2px;text-wrap:pretty}
.appbrand .vs2 em{font-style:normal;font-weight:800;color:var(--brand-deep)}
.brandrow small{display:block;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}
.tour h4{font-family:var(--f-body);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 10px}
.tour nav{display:grid;gap:2px}
.tour nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;font-weight:600;color:var(--ink-2);font-size:14px}
.tour nav button:hover{background:var(--surface)}
.tour nav button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-1)}
.tour .themebtn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
.notes{background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-1)}
.notes .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:800}
.notes h3{font-size:22px;margin:6px 0 10px}
.notes p{color:var(--ink-2);font-size:14px}
.notes ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.notes li{display:flex;gap:9px;font-size:13.5px;color:var(--ink-2)}
.notes li .ic{color:var(--brand);margin-top:1px}

.device{width:392px;height:min(852px,calc(100vh - 56px));min-height:640px;border-radius:52px;border:11px solid var(--frame);background:var(--bg);overflow:hidden;position:relative;box-shadow:0 40px 80px -30px rgba(40,20,0,.45),0 0 0 1px rgba(255,255,255,.04) inset}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:var(--frame);z-index:60}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:104px;scroll-behavior:smooth}
.view::-webkit-scrollbar{display:none}
@media (min-width:761px){.device .view{padding-top:34px}}
.view.notab{padding-bottom:130px}
@media (max-width:1100px){.notes{display:none}.stage{grid-template-columns:minmax(200px,260px) auto}}
@media (max-width:760px){
  .stage{display:block;padding:0;height:100%;min-height:0}
  .tour,.notes,.notch{display:none}
  .device{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
}

/* ---------- Generic ---------- */
.pad{padding-inline:18px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-inline:18px;margin-bottom:12px}
.sec-h h2{font-size:20px;line-height:1.15}
.sec-h>div{min-width:0}
.sec-h p{color:var(--muted);font-size:13px;margin-top:2px}
.link{margin-top:3px;flex:none;color:var(--brand);font-weight:700;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-inline:18px;scroll-padding-inline:18px;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .ic{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.wa-soft{background:var(--wa-soft);color:var(--wa)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--surface)}
.verified{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--ok);color:var(--verified-ink);flex:none}
.verified .ic{width:11px;height:11px;stroke-width:3}
.star{color:var(--gold);fill:var(--gold)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.meta b{color:var(--ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.brand{background:var(--brand-soft);color:var(--brand-deep)}
.pill.glass{background:rgba(25,10,0,.32);border:1px solid rgba(255,255,255,.22);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill.closed{background:var(--surface-2);color:var(--muted)}
.pill.new{background:var(--ink);color:var(--bg)}
.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.03em;flex:none;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.35),transparent 55%)}
.logo .ic{width:22px;height:22px;position:relative;z-index:1}
.photo{position:relative;overflow:hidden;color:#fff}
.photo::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 85% 10%,rgba(255,255,255,.26),transparent 60%),linear-gradient(to top,rgba(30,12,0,.16),transparent 55%);pointer-events:none}
.photo .glyph{position:absolute;right:-6%;bottom:-12%;width:62%;height:auto;opacity:.22;stroke:#fff;stroke-width:1.2;fill:none;transform:rotate(-12deg)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.empty-note{color:var(--muted);font-size:13px;text-align:center;padding:20px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px 0}
.loc{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.loc small{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.loc span{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px;font-family:var(--f-display)}
.loc span .ic{color:var(--brand)}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);color:#fff;background:linear-gradient(135deg,#FF8A3D,#C24A04);flex:none}

/* ---------- Home hero ---------- */
.hero{padding:18px 18px 0}
.hero .hi{color:var(--muted);font-weight:600;font-size:14px}
.hero h1{font-size:31px;line-height:1.04;margin-top:4px;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--brand)}
.search{margin-top:16px;display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-2);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15.5px;font-weight:500}
.search input::placeholder{color:var(--muted)}
.search>.ic{color:var(--muted)}
.search .filter .ic{color:var(--brand-ink);stroke-width:2.2}
.search .filter{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-top:12px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:var(--shadow-1)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding-inline:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.cat .tile{width:100%;aspect-ratio:1;max-width:70px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);transition:transform .15s}
.cat:active .tile{transform:scale(.94)}
.cat .tile .ic{width:27px;height:27px;stroke-width:1.8}
.cat>span:last-child{font-size:11.5px;font-weight:600;line-height:1.15;color:var(--ink-2);min-height:27px}
.cats{row-gap:12px}

/* rewards strip */
.rw{margin:24px 18px 0;padding:16px;border-radius:var(--r-lg);background:var(--dark-card);color:#F6F1EA;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;text-align:left;width:calc(100% - 36px)}
.rw::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 55%,transparent),transparent 65%)}
.rw .badge{width:48px;height:48px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.rw .txt{flex:1;min-width:0;position:relative;z-index:1;display:block}
.rw .bar{display:block}
.rw .txt b{font-family:var(--f-display);font-size:16px}
.rw .txt small{display:block;opacity:.7;font-size:12.5px;margin-top:1px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--brand))}
.rw .pts{position:relative;z-index:1;text-align:right;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.rw .pts small{display:block;font-family:var(--f-body);font-size:11px;opacity:.65;font-weight:600}

/* featured */
.feat{width:300px;height:176px;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.feat h3{font-size:23px;line-height:1.05;position:relative;max-width:78%}
.feat p{font-size:13px;opacity:.92;margin-top:5px;position:relative;max-width:80%}
.feat .row{display:flex;align-items:center;justify-content:space-between;position:relative}
.feat .cta{background:#fff;color:#1a1208;height:34px;padding:0 14px;border-radius:11px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{width:18px;background:var(--brand)}

/* near list */
.radius{display:flex;gap:8px;padding-inline:18px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.bizrow{display:flex;gap:12px;align-items:center;padding:12px;margin:0 18px 10px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);width:calc(100% - 36px);text-align:left}
.bizrow .logo{width:58px;height:58px;border-radius:15px}
.bizrow .info{flex:1;min-width:0}
.bizrow .name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15.5px;font-family:var(--f-display);letter-spacing:-.01em}
.bizrow .name>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bizrow .meta{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.meta .sep{flex:none}
.bizrow .meta>span:last-child,.procard .meta>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.procard .meta{overflow:hidden}
.rec{display:block;font-size:12.5px;color:var(--ok);font-weight:700;margin-top:3px}
.bizrow .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 5px}
.dist{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.dist b{font-family:var(--f-display);font-size:15px}
.dist small{color:var(--muted);font-size:11px;font-weight:600}

/* coupons */
.coupon{width:min(280px,78vw);display:flex;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-1);text-align:left;position:relative}
.coupon .l{width:86px;display:grid;place-items:center;color:#fff;position:relative;flex:none;padding:10px}
.coupon .l b{font-family:var(--f-display);font-size:24px;line-height:.95;text-align:center;font-weight:800;position:relative}

/* connect promo */

/* new grid */

.join{margin:32px 18px 0;padding:20px;border-radius:var(--r-xl);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 62%);border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));display:grid;gap:12px}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:68px;border-radius:24px;background:color-mix(in srgb,var(--surface) 98%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 30px -12px rgba(30,15,0,.35),0 0 0 1px var(--line);display:flex;align-items:center;justify-content:space-around;z-index:40;padding:0 6px;transition:transform .25s,opacity .25s}

.tabbar.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:56px;justify-content:center;border-radius:16px;position:relative}

.tabbar .mapbtn .ring{width:46px;height:46px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-6px;box-shadow:0 10px 18px -8px var(--brand)}

/* ---------- Sub headers ---------- */
.subhead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.subhead small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
.pagehead{padding:14px 18px 4px}
.pagehead h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.pagehead p{color:var(--muted);margin-top:4px;font-size:14px}

/* ---------- Discover ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}

.post .ph small{display:block;color:var(--muted);font-size:12px}

.post .acts .sp{flex:1}
.post .cap{padding:2px 16px 14px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.post .cap b{color:var(--ink)}
.post .cta-row{padding:0 16px 16px;display:flex;gap:10px}
.raffle{display:flex;align-items:center;gap:12px;margin:0 16px 16px;padding:12px 12px 12px 14px;line-height:1.3;border-radius:16px;background:var(--brand-soft);color:var(--brand-deep);font-size:13px;font-weight:600}
.raffle b{font-family:var(--f-display);font-size:17px}
.raffle small{display:block;font-weight:500;opacity:.85;font-size:12px;margin-top:2px}
.raffle .btn{flex:none}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :is(.post,.card,.bizrow,.procard,.kpi,.chartcard,.list,.prod,.svc,.review,.revsum,.trust,.subcard,.alliance,.formcard,.lvl,.newcard,.coupon,.qr,.quick button,.proftag){box-shadow:0 0 0 1px var(--line)}}
:root[data-theme="dark"] :is(.post,.card,.bizrow,.procard,.kpi,.chartcard,.list,.prod,.svc,.review,.revsum,.trust,.subcard,.alliance,.formcard,.lvl,.newcard,.coupon,.qr,.quick button,.proftag){box-shadow:0 0 0 1px var(--line)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat .tile{background:color-mix(in srgb,var(--c) 24%,var(--surface));color:color-mix(in srgb,var(--c) 62%,#fff)}}
/* ---------- Map ---------- */

.procard{grid-template-columns:minmax(0,1fr);margin:0 18px 12px;padding:14px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);display:grid;gap:12px}

.tabs{display:flex;gap:4px;padding:4px;margin:20px 18px 0;background:var(--surface-2);border-radius:16px;position:sticky;top:8px;z-index:10}

function chart(per,total,delta,pl){
 const n=per==='7d'?7:per==='30d'?30:90;let seed=n*7+3;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 const avg=total/n;const d=[],prev=[];for(let i=0;i<n;i++){const wk=(i%7===5||i%7===6)?1.25:0.92;d.push(avg*(0.78+i/n*0.38)*wk*(0.85+rnd()*0.3));prev.push(avg/1.18*(0.85+rnd()*0.3)*wk)}
 const sum=d.reduce((a,b)=>a+b,0);for(let i=0;i<n;i++)d[i]=d[i]*total/sum;
 const W=320,H=140,P=8,top=18,base=H-20,mx=Math.max(...d,...prev)*1.1;const x=i=>P+i*(W-2*P)/(n-1),y=v=>base-(v/mx)*(base-top);
 const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 const line=path(d),area=line+` L${x(n-1)} ${base} L${x(0)} ${base}Z`;
 const today=new Date(2026,9,7);const lab=k=>{const t=new Date(today);t.setDate(t.getDate()-k);return t.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][t.getMonth()]};
 const xl=per==='7d'?['J','V','S','D','L','M','Hoy'].map((l,i)=>[i,l]):[[0,lab(n-1)],[Math.round((n-1)/2),lab(n-1-Math.round((n-1)/2))],[n-1,'Hoy']];
 const T=(xx,t,anc)=>`<text x="${xx}" y="${H-3}" text-anchor="${anc}" font-size="10" font-weight="700" fill="var(--muted)" font-family="Figtree,system-ui">${t}</text>`;
 return `<div class="chartcard"><div class="h"><div><b>Visitas al perfil</b><div class="meta"><span class="num">${total.toLocaleString('es-CO')} en ${pl}</span></div></div><span class="pill open">${ic('trending-up','xs')} ${delta}</span></div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas: ${total} en ${pl}, ${delta} frente al período anterior"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".3"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
 ${[0,1].map(i=>`<line x1="${P}" x2="${W-P}" y1="${top+i*((base-top)/2)}" y2="${top+i*((base-top)/2)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}<line x1="${P}" x2="${W-P}" y1="${base}" y2="${base}" stroke="var(--line)"/>
 <text x="${P}" y="${top-5}" font-size="10" font-weight="700" fill="var(--muted)" font-family="Figtree,system-ui">${Math.round(mx)} por día</text>
 <path d="${path(prev)}" fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-dasharray="4 4" stroke-width="1.5"/>
 <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="${x(n-1)}" cy="${y(d[n-1])}" r="5" fill="var(--surface)" stroke="var(--brand)" stroke-width="3"/>
 ${xl.map(([i,l],j)=>T(x(i),l,per==='7d'?'middle':j===0?'start':j===xl.length-1?'end':'middle')).join('')}</svg>
 <div class="meta" style="margin-top:8px;gap:14px"><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:14px;height:3px;border-radius:2px;background:var(--brand);display:inline-block"></i>Este período</span><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:14px;height:0;border-top:2px dashed var(--muted);display:inline-block"></i>Período anterior</span></div></div>`}

function render(keep){
 const v=$('#view');const top=v.scrollTop;
 const f={home,discover,map:mapScreen,connect,business,account,panel,join,search}[S.screen]||home;
 v.innerHTML=`<div class="${keep?'':'fade'}${S.screen==='map'?' fill':''}">${f()}</div>`;
 const dock=$('#dock');dock.innerHTML='';const ab=v.querySelector('.actionbar');if(ab)dock.appendChild(ab);
 v.classList.toggle('notab',!MAIN.includes(S.screen));
 v.style.overflowY=S.screen==='map'?'hidden':'auto';
 if(keep)v.scrollTop=top;else v.scrollTop=0;
 $('#tabbar').classList.toggle('hide',!MAIN.includes(S.screen));
 $('#tabbar').innerHTML=[['home','Inicio','house'],['discover','Descubre','compass'],['map','Mapa','map-pinned'],['connect','Conecta','users'],['account','Cuenta','circle-user-round']].map(([k,l,i])=>k==='map'?`<button type="button" class="mapbtn ${S.screen===k?'on':''}" onclick="S.stack=[];go('${k}')" aria-label="${l}"><span class="ring">${ic(i)}</span></button>`:`<button type="button" class="${S.screen===k?'on':''}" onclick="S.stack=[];go('${k}')">${ic(i)}${l}</button>`).join('');
 const key=S.screen==='search'?'home':S.screen;
 $('#tourNav').innerHTML=SCREENS.map(([k,l,i])=>`<button type="button" class="${key===k?'on':''}" onclick="${k==='business'?"openBiz('aloha')":k==='join'?"S.joinStep=0;go('join')":`go('${k}')`}">${ic(i,'s')}${l}</button>`).join('');
 const n=NOTES[key]||NOTES.home;$('#notes').innerHTML=`<span class="eyebrow">Pantalla</span><h3>${n[0]}</h3><p>${n[1]}</p><ul>${n[2].map(x=>`<li>${ic('check','s')}<span>${x}</span></li>`).join('')}</ul>`;
 if(S.screen==='account')drawQR();
}
function drawQR(){const c=document.getElementById('qrc');if(!c)return;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,25,25);g.fillStyle='#17140F';let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
 for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(!f&&r()>.52)g.fillRect(x,y,1,1)}
 [[0,0],[18,0],[0,18]].forEach(([x,y])=>{g.fillRect(x,y,7,7);g.fillStyle='#fff';g.fillRect(x+1,y+1,5,5);g.fillStyle='#17140F';g.fillRect(x+2,y+2,3,3)})}
$('#scrim').onclick=closeSheet;
$('#logoA').innerHTML=mark(42);
/* theme toggle (per-viewer) */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('#themeBtn').innerHTML=ic(dark?'sun':'moon','s')+(dark?'Modo claro':'Modo oscuro')}
window.toggleTheme=()=>{const cur=document.documentElement.getAttribute('data-theme')||'light';const nx=cur==='dark'?'light':'dark';try{localStorage.setItem('euc-theme',nx)}catch(e){}applyTheme(nx);render(true)};
$('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';try{localStorage.setItem('euc-theme',nx)}catch(e){}applyTheme(nx)};
let saved=null;try{saved=localStorage.getItem('euc-theme')}catch(e){}applyTheme(saved||'light');
render();
</script>

</body>
</html>
